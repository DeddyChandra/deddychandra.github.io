<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bandar Detector Order Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1020;
            color: #e8eefc;
            margin: 24px;
        }

        .card {
            max-width: 1200px;
            margin: 0 auto;
            background: #111a33;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 12px;
        }

        thead th {
            background: rgba(255,255,255,0.06);
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.6px;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.10);
            color: #e8eefc !important;
        }

        tbody td {
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 14px;
            color: #e8eefc !important;
        }

        tbody tr:hover {
            background: rgba(255,255,255,0.04);
        }

        .num { text-align: right; font-variant-numeric: tabular-nums; }
        .center { text-align: center; }

        /* Optional: visually split Bid vs Offer side */
        .split-left  { border-right: 1px solid rgba(255,255,255,0.10); }
        .split-mid   { border-right: 1px solid rgba(255,255,255,0.10); }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: 12px;
            background: rgba(255,255,255,0.08);
        }
        .form-label, .btn, .badge, h1 {
            color: #e8eefc !important;
        }

        .info-bar {
            background: #192040;
            color: #e8eefc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .info-bar .text-secondary {
            opacity: 0.75;
        }
        .info-bar .text-success {
            color: #28a745 !important;
        }
        .info-bar .text-danger {
            color: #dc3545 !important;
        }

        /* Make Split Order columns wider for long values */
        th.split-order, td.split-order {
            min-width: 140px;
            max-width: 260px;
            white-space: pre-line;
            word-break: break-all;
            vertical-align: middle !important;
            text-align: left;
        }

    </style>
</head>
<body>
<div class="card position-relative">
    <button class="btn btn-outline-light btn-sm rounded-circle position-absolute top-0 end-0 m-3 d-flex align-items-center justify-content-center" type="button" data-bs-toggle="offcanvas" data-bs-target="#drawerToken" aria-controls="drawerToken" title="Open Token Drawer" style="width:36px; height:36px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-key" viewBox="0 0 16 16">
          <path d="M3 10a5 5 0 1 1 9.584-2.062l.707.707a1 1 0 0 1 0 1.414l-2.5 2.5a1 1 0 0 1-1.414 0l-.707-.707A5 5 0 0 1 3 10zm5-4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-2.5 4a.5.5 0 1 1 1 0 .5.5 0 0 1-1 0z"/>
        </svg>
    </button>

    <!-- Order Book Title and Code Input -->
    <div class="mb-3">
        <h1><i class="fa-solid fa-fish me-2"></i>Bandar Detector Order Book <span class="badge" id="orderBookCode"></span></h1>

        <!-- Code Input -->
        <div class="mb-3 d-flex align-items-center" style="gap:8px;">
          <label for="codeInput" class="form-label mb-0">Code:</label>
          <input type="text" id="codeInput" class="form-control" placeholder="PTRO" style="max-width:120px;" />
          <button id="callApiBtn" class="btn btn-outline-success">Search</button>
        </div>
        <div class="d-flex align-items-center mb-3" style="gap:8px;">
          <label for="codeInput" class="form-label mb-0">Quick watch list:</label>
          <div id="watchlistBtnContainer" class="d-flex flex-wrap gap-2"></div>
        </div>
    </div>

    <!-- Info Bar -->
    <div class="info-bar mb-3 p-2 rounded" style="background:#192040;">
      <div class="container-fluid">
        <div class="row g-2 align-items-center">
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">Open</span>
              <span class="text-success fw-bold" id="infoOpen"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| Prev</span>
              <span class="text-light fw-bold" id="infoPrev"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| Lot</span>
              <span class="text-light fw-bold" id="infoLot"></span>
            </div>
          </div>
        </div>
        <div class="row g-2 align-items-center mt-1">
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">High</span>
              <span class="text-success fw-bold" id="infoHigh"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| ARA</span>
              <span class="text-light fw-bold" id="infoARA"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| Val</span>
              <span class="text-light fw-bold" id="infoVal"></span>
            </div>
          </div>
        </div>
        <div class="row g-2 align-items-center mt-1">
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">Low</span>
              <span class="text-danger fw-bold" id="infoLow"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| ARB</span>
              <span class="text-light fw-bold" id="infoARB"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| Avg</span>
              <span class="text-light fw-bold" id="infoAvg"></span>
            </div>
          </div>
        </div>
        <div class="row g-2 align-items-center mt-1">
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">F Buy</span>
              <span class="text-success fw-bold" id="infoFBuy"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| F Sell</span>
              <span class="text-danger fw-bold" id="infoFSell"></span>
            </div>
          </div>
          <div class="col-4 col-md-4">
            <div class="d-flex justify-content-between">
              <span class="fw-bold text-white">| Freq</span>
              <span class="text-light fw-bold" id="infoFreq"></span>
            </div>
          </div>
        </div>
      </div>
    </div>



    <table aria-label="Stock order book">
        <thead>
        <tr>
            <td colspan="9" class="bg-transparent p-2">
                <div class="d-flex align-items-center mb-2 flex-wrap" style="gap:8px;">
                    <label for="minBidBandarInput" class="form-label mb-0">Minimal lot Bandar:</label>
                    <input type="text" id="minBidBandarInput" class="form-control text-center" style="max-width:120px;" />
                </div>
                <div class="d-flex flex-wrap gap-2 mb-2">
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(100)">100</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(500)">500</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(1000)">1.000</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(5000)">5.000</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(10000)">10.000</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(20000)">20.000</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(30000)">30.000</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(40000)">40.000</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setMinBidBandar(50000)">50.000</button>
                </div>
            </td>
        </tr>
        <tr>
            <th class="center split-order">Split <br> Order <i class="fa fa-info-circle text" data-bs-toggle="tooltip" data-bs-placement="top" title="formula = time x freq : lot" style="font-size:13px;cursor:pointer;"></i>
            </th>
            <th class="center">Bandar <br> Freq</th>
            <th class="center">Freq</th>
            <th class="center">Lot</th>
            <th class="center split-left">Bid</th>
            <th class="center split-right">Offer</th>
            <th class="center">Lot</th>
            <th class="center">Freq</th>
            <th class="center">Bandar <br> Freq</th>
            <th class="center split-order">Split <br> Order<i class="fa fa-info-circle ms-1 text" data-bs-toggle="tooltip" data-bs-placement="top" title="formula = time x freq : lot" style="font-size:13px;cursor:pointer;"></i>
            </th>
        </tr>
        </thead>
        <tbody id="orderbook-body">
        <!-- Rows will be injected by JS -->
        </tbody>
    </table>
    <div class="text-center mt-3" style="color:#aaa; font-size:13px;">
        &copy; Deddy Chandra <br> <i class="fa-solid fa-envelope"></i> deddychandra678@gmail.com
    </div>
</div>

<!-- Drawer (Bootstrap Offcanvas) -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="drawerToken" aria-labelledby="drawerTokenLabel" style="background:#111a33; color:#e8eefc;">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="drawerTokenLabel">Developer Tools</h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">
    <div class="mb-3">
      <label for="tokenInput" class="form-label">Token</label>
      <input type="text" class="form-control" id="tokenInput" placeholder="Enter your token" style="background:#192040; color:#e8eefc; border:1px solid #2a3550;" />
    </div>
    <div class="mb-3">
      <label for="watchlistInput" class="form-label">Watchlist</label>
      <input type="text" class="form-control" id="watchlistInput" placeholder="e.g. coco, supa, bumi" style="background:#192040; color:#e8eefc; border:1px solid #2a3550;" />
      <button id="saveWatchlistBtn" class="btn btn-success btn-sm mt-1">Save</button>
    </div>
    <div class="mb-3">
      <label for="minStocksplitInput" class="form-label">Minimum number of matching minutes and seconds</label>
      <input type="number" class="form-control" id="minStocksplitInput" placeholder="e.g. 5" style="background:#192040; color:#e8eefc; border:1px solid #2a3550;" />
      <div class="form-text text-light" style="opacity:0.7;">Minimum number of matching minutes and seconds</div>
    </div>
    <label class="form-label">Company-price-feed/v2/orderbook</label>
    <div id="company-price-feed-orderbook" style="background:#192040; color:#e8eefc; border-radius:8px; padding:10px; min-height:60px;"></div>
    <label class="form-label mt-3">order-trade/order-queue</label>
    <div id="orderqueue-result" style="background:#192040; color:#e8eefc; border-radius:8px; padding:10px; min-height:60px;"></div>
  </div>
</div>

<script src="../scripts/orderbook.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Enable Bootstrap tooltips
  var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
  tooltipTriggerList.forEach(function (tooltipTriggerEl) {
    new bootstrap.Tooltip(tooltipTriggerEl);
  });
</script>
</body>
</html>
